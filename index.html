<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specialkost - Fulköpings bokmässa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">

    <div class="header">
      <h1>Beställning av mat till Fulköpings bokmässa</h1>
      <p>Vid frågor, kontakta vår kundtjänst: <br> fulkopingsbokmassa@gmail.com</p>
    </div>

    <div class="order-form">

      <div class="form-p"> <p>Fyll i hur många som ska äta och hur många som 
        behöver vegetarisk eller vegansk mat. Det tar ungefär 2 minuter.</p></div>

      <div class="form-field">
        <label for="conferenceDate">Bokmässans datum</label>
        <input type="date" id="conferenceDate" name="conferenceDate">
      </div>

      <div class="form-field">
        <label for="deliveryDate">Leveransdatum</label>
        <input type="date" id="deliveryDate" name="deliveryDate">
      </div>

      <div class="form-field">
        <label for="participants">Antal deltagare totalt</label>
        <input type="text" id="participants" name="participants">
      </div>

      <div class="form-field">
        <label for="vegetarian">Antal vegetariska portioner</label>
        <input type="text" id="vegetarian" name="vegetarian">
      </div>

      <div class="form-field">
        <label for="vegan">Antal veganportioner</label>
        <input type="text" id="vegan" name="vegan">
      </div>

      <div class="form-actions">
        <button type="button" id="submitBtn">Skicka beställning</button>
      </div>

      <div class="messages" id="messages"></div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
